<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Padel">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Padel reserveren</title>
<style>
:root {
  --bg: #f2f2f7; --kaart: #ffffff; --tekst: #1c1c1e; --zacht: #6c6c70; --lijn: #d8d8dc;
  --accent: #0a7d4f; --accent-tekst: #ffffff; --rood: #c62828; --blauw: #1f5fbf; --veld: #f7f7fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --kaart: #1c1c1e; --tekst: #f2f2f7; --zacht: #a1a1a6; --lijn: #38383a;
    --accent: #30c27f; --accent-tekst: #04140c; --rood: #ff6b6b; --blauw: #74a7ff; --veld: #2c2c2e;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tekst);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
body { padding: max(12px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
main { max-width: 560px; margin: 0 auto; }
h1 { font-size: 28px; margin: 8px 0 4px; letter-spacing: -0.02em; }
.intro { color: var(--zacht); font-size: 15px; margin: 0 0 8px; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  color: var(--zacht); margin: 24px 4px 8px; }
.kaart { background: var(--kaart); border-radius: 14px; padding: 16px; }
label { display: block; font-size: 14px; color: var(--zacht); margin: 12px 0 4px; }
label:first-child { margin-top: 0; }
input, select { width: 100%; font: inherit; color: var(--tekst); background: var(--veld);
  border: 1px solid var(--lijn); border-radius: 10px; padding: 11px 12px; min-height: 44px;
  -webkit-appearance: none; appearance: none; }
input[type=checkbox] { width: 22px; height: 22px; min-height: 0; padding: 0;
  -webkit-appearance: auto; appearance: auto; accent-color: var(--accent); flex: none; }
.rij { display: flex; gap: 10px; }
.rij > * { flex: 1; min-width: 0; }
.vink { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--tekst); font-size: 15px; }
button, .knop { display: flex; align-items: center; justify-content: center; font: inherit; font-weight: 600;
  border: 0; border-radius: 12px; min-height: 48px; padding: 0 16px; background: var(--accent);
  color: var(--accent-tekst); width: 100%; margin-top: 16px; cursor: pointer; text-decoration: none; }
.klein { width: auto; min-height: 36px; margin: 0; padding: 0 12px; font-size: 14px;
  background: var(--veld); color: var(--tekst); border: 1px solid var(--lijn); }
.gevaar { color: var(--rood); }
.hint { font-size: 14px; color: var(--zacht); margin: 10px 0 0; }
.melding { border-radius: 12px; padding: 12px 14px; margin: 12px 0 0; font-size: 15px; }
.melding.ok { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.melding.fout { background: color-mix(in srgb, var(--rood) 16%, transparent); }
.item { border-top: 1px solid var(--lijn); padding: 14px 0; }
.item:first-child { border-top: 0; padding-top: 0; }
.item:last-child { padding-bottom: 0; }
.item strong { font-size: 17px; }
.details { font-size: 14px; color: var(--zacht); margin-top: 4px; overflow-wrap: anywhere; }
.knoppen { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.leeg { color: var(--zacht); font-size: 15px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Padel reserveren</h1>
  <p class="intro">Plan je baan en krijg een agenda-herinnering zodra reserveren opengaat (7 dagen vooraf, 03:00), met de link en je medespelers erbij.</p>

  <h2>Nieuwe herinnering</h2>
  <form class="kaart" id="formulier" autocomplete="off">
    <div class="rij">
      <div><label for="datum">Speeldag</label><input id="datum" type="date" required></div>
      <div><label for="tijd">Tijd</label><select id="tijd" required></select></div>
    </div>
    <label for="baan">Baan</label>
    <input id="baan" placeholder="bijv. Padel 2">
    <label for="speler1">Medespelers</label>
    <input id="speler1" list="spelerslijst" placeholder="Voor- en achternaam">
    <input id="speler2" list="spelerslijst" placeholder="Voor- en achternaam" style="margin-top:8px">
    <input id="speler3" list="spelerslijst" placeholder="Voor- en achternaam" style="margin-top:8px">
    <datalist id="spelerslijst"></datalist>
    <label for="moment">Herinnering</label>
    <select id="moment">
      <option value="0300">Om 03:00, zodra het opengaat</option>
      <option value="0655">Om 06:55</option>
      <option value="0730">Om 07:30</option>
    </select>
    <label class="vink"><input type="checkbox" id="ookWedstrijd" checked> Zet het padelen zelf ook in mijn agenda</label>
    <p class="hint" id="wanneer">Kies een speeldag.</p>
    <button type="submit">Toevoegen aan agenda</button>
    <div id="melding"></div>
  </form>

  <h2>Gepland</h2>
  <div class="kaart" id="lijst"><p class="leeg">Nog niets gepland.</p></div>

  <a class="knop klein" style="width:100%;margin-top:24px;min-height:44px"
     href="https://www.mijdrechtse-tpv.nl/me/ReservationsPlayers" target="_blank" rel="noopener">Naar de reserveerpagina</a>
</main>

<script>
const RESERVEER_URL = "https://www.mijdrechtse-tpv.nl/me/ReservationsPlayers";
const DAGEN_VOORUIT = 7;
const $ = id => document.getElementById(id);
const DAGEN = ["zo", "ma", "di", "wo", "do", "vr", "za"];
const MAANDEN = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

function lees(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function schrijf(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const pad = n => String(n).padStart(2, "0");
function datumLokaal(iso) { const [j, m, d] = iso.split("-").map(Number); return new Date(j, m - 1, d); }
function vandaagIso() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function mooi(d) { return `${DAGEN[d.getDay()]} ${d.getDate()} ${MAANDEN[d.getMonth()]}`; }
function opening(iso, moment = "0300") {
  const d = datumLokaal(iso); d.setDate(d.getDate() - DAGEN_VOORUIT);
  d.setHours(+moment.slice(0, 2), +moment.slice(2), 0, 0); return d;
}

// ── formulier ──
for (let u = 7; u <= 23; u++) for (const m of ["00", "30"]) {
  if (u === 23 && m === "30") continue;
  const t = `${pad(u)}:${m}`; $("tijd").add(new Option(t, t, false, t === "19:00"));
}
$("datum").min = vandaagIso();
$("baan").value = lees("padel_baan", "");
[1, 2, 3].forEach(i => $("speler" + i).value = lees("padel_speler" + i, ""));
$("moment").value = lees("padel_moment", "0300");
$("spelerslijst").innerHTML = lees("padel_namen", []).map(n => `<option value="${esc(n)}">`).join("");

function werkWanneerBij() {
  const iso = $("datum").value;
  if (!iso) { $("wanneer").textContent = "Kies een speeldag."; return; }
  const o = opening(iso);
  $("wanneer").textContent = o <= new Date()
    ? "Reserveren kan al: doe het meteen via de knop onderaan."
    : `Reserveren kan vanaf ${mooi(o)} om 03:00.`;
}
$("datum").addEventListener("change", werkWanneerBij);

// ── agenda-bestand (.ics) ──
function icsTijd(d) { return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`; }
function icsTekst(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
function vouw(regel) { const uit = []; while (regel.length > 72) { uit.push(regel.slice(0, 72)); regel = " " + regel.slice(72); } uit.push(regel); return uit.join("\r\n"); }
const TZ = ["BEGIN:VTIMEZONE", "TZID:Europe/Amsterdam",
  "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST", "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
  "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET", "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
  "END:VTIMEZONE"];

function maakIcs(p) {
  const speel = datumLokaal(p.datum); const [u, m] = p.tijd.split(":").map(Number); speel.setHours(u, m, 0, 0);
  const herinner = opening(p.datum, p.moment);
  const stempel = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const spelers = p.spelers.filter(Boolean);
  const beschrijving = `Reserveer: ${mooi(speel)} om ${p.tijd}${p.baan ? ", " + p.baan : ""}\n` +
    (spelers.length ? `Medespelers: ${spelers.join(", ")}\n` : "") + `\n${RESERVEER_URL}`;
  const regels = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//padel-app//NL", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...TZ,
    "BEGIN:VEVENT", `UID:${p.id}-reserveren@padel-app`, `DTSTAMP:${stempel}`,
    `DTSTART;TZID=Europe/Amsterdam:${icsTijd(herinner)}`, `DTEND;TZID=Europe/Amsterdam:${icsTijd(new Date(herinner.getTime() + 10 * 60000))}`,
    `SUMMARY:${icsTekst(`🎾 Padelbaan reserveren (${DAGEN[speel.getDay()]} ${p.tijd})`)}`,
    `DESCRIPTION:${icsTekst(beschrijving)}`, `URL:${RESERVEER_URL}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsTekst("Padelbaan reserveren: nu open")}`, "TRIGGER:PT0M", "END:VALARM",
    "END:VEVENT"];
  if (p.ookWedstrijd) {
    regels.push("BEGIN:VEVENT", `UID:${p.id}-spelen@padel-app`, `DTSTAMP:${stempel}`,
      `DTSTART;TZID=Europe/Amsterdam:${icsTijd(speel)}`, `DTEND;TZID=Europe/Amsterdam:${icsTijd(new Date(speel.getTime() + 90 * 60000))}`,
      `SUMMARY:${icsTekst("🎾 Padel" + (spelers.length ? " met " + spelers.map(s => s.split(" ")[0]).join(", ") : ""))}`,
      `LOCATION:${icsTekst("De Mijdrechtse TPV, Dr. J. van der Haarlaan 1, Mijdrecht")}`,
      `DESCRIPTION:${icsTekst((p.baan ? p.baan + "\n" : "") + (spelers.length ? "Met: " + spelers.join(", ") : ""))}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Padel", "TRIGGER:-PT60M", "END:VALARM",
      "END:VEVENT");
  }
  regels.push("END:VCALENDAR");
  return regels.map(vouw).join("\r\n") + "\r\n";
}

function openInAgenda(p) {
  // Een data-link met text/calendar laat iPhone direct "Voeg toe aan agenda" tonen.
  const a = document.createElement("a");
  a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(maakIcs(p));
  a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}

// ── opslaan en lijst ──
function toon(tekst, soort = "ok") { $("melding").innerHTML = tekst ? `<div class="melding ${soort}">${esc(tekst)}</div>` : ""; }

$("formulier").addEventListener("submit", e => {
  e.preventDefault();
  const datum = $("datum").value;
  if (!datum) return toon("Kies een speeldag.", "fout");
  if (datum < vandaagIso()) return toon("Die dag is al voorbij.", "fout");
  const p = { id: Date.now().toString(36), datum, tijd: $("tijd").value, baan: $("baan").value.trim(),
    spelers: [1, 2, 3].map(i => $("speler" + i).value.trim().replace(/\s+/g, " ")),
    moment: $("moment").value, ookWedstrijd: $("ookWedstrijd").checked };
  schrijf("padel_baan", p.baan); schrijf("padel_moment", p.moment);
  p.spelers.forEach((s, i) => schrijf("padel_speler" + (i + 1), s));
  const namen = [...new Set([...lees("padel_namen", []), ...p.spelers.filter(Boolean)])].sort((a, b) => a.localeCompare(b));
  schrijf("padel_namen", namen);
  $("spelerslijst").innerHTML = namen.map(n => `<option value="${esc(n)}">`).join("");
  const lijst = lees("padel_gepland", []); lijst.push(p); schrijf("padel_gepland", lijst);
  tekenLijst();
  const o = opening(p.datum);
  toon(o <= new Date() ? "Reserveren kan al! Tik op 'Naar de reserveerpagina'." :
       "Kies in het venster dat verschijnt 'Voeg alles toe' om het in je agenda te zetten.");
  openInAgenda(p);
});

function tekenLijst() {
  const vandaag = vandaagIso();
  const lijst = lees("padel_gepland", []).filter(p => p.datum >= vandaag)
    .sort((a, b) => (a.datum + a.tijd).localeCompare(b.datum + b.tijd));
  schrijf("padel_gepland", lijst);
  if (!lijst.length) { $("lijst").innerHTML = `<p class="leeg">Nog niets gepland.</p>`; return; }
  $("lijst").innerHTML = lijst.map(p => {
    const speel = datumLokaal(p.datum), o = opening(p.datum);
    const open = o <= new Date();
    return `<div class="item"><strong>${mooi(speel)} · ${esc(p.tijd)}</strong>
      <div class="details">${p.baan ? esc(p.baan) + " · " : ""}${p.spelers.filter(Boolean).map(esc).join(", ") || "geen medespelers ingevuld"}<br>
      ${open ? "Reserveren kan nu" : `Reserveren vanaf ${mooi(o)} 03:00`}</div>
      <div class="knoppen">
        ${open ? `<a class="knop klein" href="${RESERVEER_URL}" target="_blank" rel="noopener">Reserveren</a>` : ""}
        <button class="klein" data-actie="agenda" data-id="${esc(p.id)}">Opnieuw in agenda</button>
        <button class="klein gevaar" data-actie="weg" data-id="${esc(p.id)}">Verwijderen</button>
      </div></div>`;
  }).join("");
}
$("lijst").addEventListener("click", e => {
  const k = e.target.closest("button[data-actie]"); if (!k) return;
  const lijst = lees("padel_gepland", []); const p = lijst.find(x => x.id === k.dataset.id); if (!p) return;
  if (k.dataset.actie === "agenda") openInAgenda(p);
  else { schrijf("padel_gepland", lijst.filter(x => x.id !== p.id)); tekenLijst(); }
});

tekenLijst();
werkWanneerBij();
</script>
</body>
</html>
